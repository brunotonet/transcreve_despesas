services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transcreve_despesas
      POSTGRES_USER: ${DB_USER:-transcreve}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transcreve}
    ports:
      - "5432:5432"
    volumes:
      - transcreve-despesas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transcreve} -d transcreve_despesas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transcreve-despesas-data:
